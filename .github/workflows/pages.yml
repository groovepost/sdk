name: Publish SDK documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sdk-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs:build
      - run: npm run docs:verify
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/checkout@v7.0.1
      - name: Verify published commit and required pages
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/check-built-docs.mjs "$DOCS_URL"; then exit 0; fi
            sleep 10
          done
          exit 1
        env:
          DOCS_URL: ${{ steps.deployment.outputs.page_url }}
          DOCS_REVISION: ${{ github.sha }}
