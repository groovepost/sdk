name: Authenticated registry examples
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [rest-client, countdown-screen, themed-controls, native-post-list]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Configure package-read authentication
        run: |
          test -n "$PACKAGE_READ_TOKEN"
          npm config set //npm.pkg.github.com/:_authToken "$PACKAGE_READ_TOKEN" --location=user
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
      - run: npm run package --if-present
  reference:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Configure package-read authentication
        run: |
          test -n "$PACKAGE_READ_TOKEN"
          npm config set @groovepost:registry https://npm.pkg.github.com --location=user
          npm config set @danielmarkland:registry https://npm.pkg.github.com --location=user
          npm config set //npm.pkg.github.com/:_authToken "$PACKAGE_READ_TOKEN" --location=user
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: npm run reference:check
