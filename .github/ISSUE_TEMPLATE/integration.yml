name: SDK integration problem
description: Report a reproducible consumer integration issue.
body:
  - type: markdown
    attributes:
      value: Do not include tokens, customer data, or private implementation code. Use private reporting for vulnerabilities.
  - type: input
    id: versions
    attributes:
      label: Package versions and environment
      description: Include exact SDK versions, Node version, operating system and browser if applicable.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal consumer steps or a sanitized public example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include sanitized error codes/statuses.
    validations:
      required: true
